name: Telegram Userbot CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-userbot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      BOT_TOKEN: "000000000:TEST_TOKEN"
      API_ID: "12345"
      API_HASH: "test_api_hash"
      MONGO_URI: "mongodb://localhost:27017/test"
      ADMIN_IDS: "123456789"
      GROQ_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create ephemeral test encryption key
        run: |
          echo "SESSION_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -q

  security:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Verify .env is ignored
        run: git check-ignore -q .env

      - name: Check obvious credential assignments
        shell: bash
        run: |
          set -e
          pattern='(BOT_TOKEN|API_HASH|MONGO_URI|SESSION_ENCRYPTION_KEY|GROQ_API_KEY)[[:space:]]*=[[:space:]]*["'"'"'][^"'"'"']+["'"'"']'
          if grep -RInE \
            --exclude-dir=.git \
            --exclude='*.md' \
            --exclude='.env.example' \
            "$pattern" .; then
            echo "::error::Possible hardcoded credential found."
            exit 1
          fi

  package:
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - uses: actions/checkout@v4

      - name: Create package
        run: |
          mkdir -p build
          zip -r "build/telegram-userbot-${{ github.sha }}.zip" . \
            -x ".git/*" ".github/*" ".venv/*" "__pycache__/*" "*.pyc" ".env"

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-userbot-${{ github.sha }}
          path: build/*.zip
          retention-days: 7
